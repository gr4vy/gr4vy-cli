version: 2

project_name: gr4vy

before:
  hooks:
    - go mod tidy

builds:
  - id: gr4vy
    main: .
    binary: gr4vy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gr4vy
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

# Homebrew tap. Publish SDK runs GoReleaser with a gr4vy-sdk-release token that
# can write to this repo and the Scoop bucket.
brews:
  - name: gr4vy
    repository:
      owner: gr4vy
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/gr4vy/gr4vy-cli"
    description: "The Gr4vy command-line interface"
    license: "MIT"
    test: |
      system "#{bin}/gr4vy version"

# Scoop bucket for Windows.
scoops:
  - repository:
      owner: gr4vy
      name: gr4vy-scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/gr4vy/gr4vy-cli"
    description: "The Gr4vy command-line interface"
    license: MIT

# release-please creates the release first; GoReleaser keeps its notes and adds
# the binaries.
release:
  draft: false
  prerelease: auto
  mode: keep-existing
  replace_existing_artifacts: true
