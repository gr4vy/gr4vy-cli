name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # Weekdays at 09:00, after the six SDK repos (08:30-08:55), which share the
    # same e2e sandbox.
    - cron: 0 9 * * 1-5

# A new push to a PR cancels the previous in-flight run. Runs on main are never
# cancelled: the publish workflow waits for each one to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::these files are not gofmt'd:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (unit + golden)
        run: go list ./... | grep -v '/test\(/\|$\)' | xargs go test -count=1

      - name: generation is up to date
        run: |
          go generate ./...
          if ! git diff --quiet -- internal/commands/generated docs; then
            echo "::error::generated commands/docs are stale; run 'go generate ./...' and commit"
            git --no-pager diff --stat -- internal/commands/generated docs
            exit 1
          fi

      - name: smoke test
        run: |
          go build -o /tmp/gr4vy .
          /tmp/gr4vy version
          /tmp/gr4vy --help >/dev/null
          /tmp/gr4vy transactions list --help >/dev/null

  # Live suite against the shared e2e sandbox. Runs on main only (push, schedule,
  # dispatch): the key lives in the `e2e` Environment, which only main can use,
  # so a branch workflow can't read it.
  e2e:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run e2e suite
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::PRIVATE_KEY is not set in the e2e environment, so the live suite would skip."
            exit 1
          fi
          go test ./test/... -count=1 -v

  # Stable required check. On a PR it means build-test passed; on main it also
  # means the live suite passed, which is what the publish workflow waits for.
  ci-complete:
    needs: [build-test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify
        env:
          BUILD: ${{ needs.build-test.result }}
          E2E: ${{ needs.e2e.result }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$BUILD" != "success" ]; then
            echo "build-test: $BUILD"
            exit 1
          fi
          if [ "$ON_MAIN" != "true" ] && [ "$E2E" = "skipped" ]; then
            exit 0
          fi
          if [ "$E2E" != "success" ]; then
            echo "e2e: $E2E"
            exit 1
          fi

  notify:
    needs: [build-test, e2e]
    runs-on: ubuntu-latest
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gr4vy-sdk-generate[bot]')
        env:
            SLACK_USERNAME: CLI
            SLACK_TITLE: CLI
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "failure"
            SLACK_MESSAGE_ON_FAILURE: "CI failed"
            SLACK_FOOTER: ""
