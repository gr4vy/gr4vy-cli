name: Publish SDK
"on":
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Require a green CI run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$SHA&branch=main&event=push&status=success" --jq '.total_count')
          if [ "$passed" = "0" ]; then
            echo "::error::CI hasn't passed on main for $SHA, so it can't be released"
            exit 1
          fi

      - id: gate
        uses: gr4vy/sdk-release/publish-gate@4d17bbfa966f12d70db408bb1d0acc30576e0647
        with:
          head-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          bot-login: gr4vy-sdk-release[bot]
          version-source: release-please

  request-approval:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2
        env:
            SLACK_USERNAME: CLI
            SLACK_TITLE: CLI
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "#F3AB0E"
            SLACK_MESSAGE: "v${{ needs.gate.outputs.version }} is waiting for release approval: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            SLACK_FOOTER: ""

  approve:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    environment: release-manual
    steps:
      - run: echo "Release approved."

  # release-please tags the release PR's merge commit and creates a draft GitHub
  # release; GoReleaser then builds that tag into it, publishes it (immutable
  # releases lock it from then on) and updates the Homebrew tap and Scoop
  # bucket, all as gr4vy-sdk-release. The archives and checksums get a build
  # provenance attestation. If any step fails, use "Re-run failed jobs" on this
  # run: once the tag exists the gate won't publish again, but a re-run reuses
  # its decision and release-please skips the existing release. While it's still
  # a draft, GoReleaser replaces any partial assets; once published, the re-run
  # attests the published files.
  publish:
    needs: [gate, approve]
    if: >-
      always() && needs.gate.outputs.publish == 'true' &&
      (needs.gate.outputs.mode == 'auto' || needs.approve.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sdk-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Mint a gr4vy-sdk-release token for the release
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Tag and create the GitHub release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

      # The tag is on the release PR's merge commit, which is the gated commit
      # or, if something merged after it, an ancestor of it. The gate checked
      # every merge up to the gated commit, so either way it covers the tag.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null || true)
          if [ -z "$tagged" ]; then
            echo "::error::release-please did not create v$VERSION"
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$tagged" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::v$VERSION points at $tagged, which is not $SHA or one of its ancestors ($status)"
            exit 1
          fi

      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.gate.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint a gr4vy-sdk-release token for GoReleaser
        id: publish-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},homebrew-tap,gr4vy-scoop-bucket
          permission-contents: write

      # Only a draft can still take files. A re-run after GoReleaser published
      # the release attests the published files instead.
      - name: Is the release still a draft?
        id: release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: echo "draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.draft == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}

      - name: Fetch the published files
        if: steps.release.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.tar.gz' --pattern '*.zip' --pattern checksums.txt

      # GoReleaser publishes only after every file is uploaded, but updates
      # Homebrew and Scoop after that. Don't attest a release that didn't finish.
      - name: Check the published release is complete
        if: steps.release.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          (cd dist && sha256sum --check --strict checksums.txt)
          gh api repos/gr4vy/homebrew-tap/contents/gr4vy.rb --jq .content | base64 -d | grep -q "version \"$VERSION\"" ||
            { echo "::error::v$VERSION is published but gr4vy/homebrew-tap wasn't updated; update gr4vy.rb by hand"; exit 1; }
          gh api repos/gr4vy/gr4vy-scoop-bucket/contents/gr4vy.json --jq .content | base64 -d | grep -q "\"version\": \"$VERSION\"" ||
            { echo "::error::v$VERSION is published but gr4vy/gr4vy-scoop-bucket wasn't updated; update gr4vy.json by hand"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  notify:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    if: always() && (needs.gate.result == 'failure' || needs.publish.result != 'skipped')
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2
        env:
            SLACK_USERNAME: CLI
            SLACK_TITLE: CLI
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
            SLACK_MESSAGE_ON_SUCCESS: "CLI publishing succeeded - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_MESSAGE_ON_FAILURE: "CLI publishing failed - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_FOOTER: ""
